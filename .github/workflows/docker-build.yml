name: docker-build

# Builds the three service images from the single parameterized Dockerfile:
#   - on a PR touching them: build only (the merge gate — image must compile)
#   - on merge to main: build + push to ECR, tagged `latest` + short git sha
# Auth = the same OIDC role the terraform workflow uses (no stored keys).
#
# First-run note: the ECR repositories are created by the terraform apply that
# runs on the SAME merge. If this job races it and fails with "repository does
# not exist", wait for the terraform run to go green, then re-run this workflow
# (Actions -> docker-build -> Re-run jobs).

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/contract/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/contract/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  id-token: write # request the OIDC token
  contents: read

# Newer builds supersede older ones for the same ref.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [command, telemetry, fleet]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t joppilot/${{ matrix.service }}:ci .

      - name: Configure AWS credentials (OIDC)
        if: ${{ github.event_name != 'pull_request' && vars.AWS_CI_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR (main only)
        if: ${{ github.event_name != 'pull_request' && vars.AWS_CI_ROLE_ARN != '' }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE="$REGISTRY/joppilot/${{ matrix.service }}"
          docker tag "joppilot/${{ matrix.service }}:ci" "$IMAGE:latest"
          docker tag "joppilot/${{ matrix.service }}:ci" "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # The task definitions reference `:latest`, so pushing a new image does
      # NOT change the task def and ECS never cycles the tasks on its own — a
      # running task keeps serving the previous image alongside newer config
      # (bit us on 2026-07-10: services came up broken after a restore apply).
      # Skipped silently when the service doesn't exist yet (fresh env, or
      # after destroy-billables — the next terraform apply starts fresh tasks
      # that pull the image just pushed).
      - name: Roll the running service onto the new image (main only)
        if: ${{ github.event_name != 'pull_request' && vars.AWS_CI_ROLE_ARN != '' }}
        run: |
          svc="joppilot-dev-${{ matrix.service }}"
          status=$(aws ecs describe-services --cluster joppilot-dev-cluster \
            --services "$svc" --region "$AWS_REGION" \
            --query 'services[0].status' --output text 2>/dev/null || echo MISSING)
          if [ "$status" = "ACTIVE" ]; then
            aws ecs update-service --cluster joppilot-dev-cluster --service "$svc" \
              --force-new-deployment --region "$AWS_REGION" >/dev/null
            echo "$svc: rolling onto the image just pushed"
          else
            echo "$svc: not ACTIVE ($status) — nothing to roll"
          fi
